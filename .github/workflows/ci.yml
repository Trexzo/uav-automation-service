name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .[dev]
      - run: cp config/profile.example.json config/profile.json
      - run: pytest
      - run: rm config/profile.json
      - run: python scripts/security_scan.py
